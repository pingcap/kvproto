name: Golang Test
on:
  push:
    branches:
      - master
      - release-*

  pull_request:
    branches:
      - master
      - release-*

jobs:
  golang-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download protoc
        env:
          PROTOC_VERSION: "3.8.0"
        run: |
          curl -L https://github.com/google/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-linux-x86_64.zip -o protoc.zip &&\
          unzip protoc.zip -d protoc
      - name: Test Golang
        run: |
          set -euo pipefail
          export PATH="$(pwd)/protoc/bin:$PATH"
          find pkg -type f \( -name '*.pb.go' -o -name '*.pb.gw.go' \) -delete
          make go
          git diff --quiet go.mod go.sum
          go test ./scripts/verify_generated_go
          go run ./scripts/verify_generated_go
